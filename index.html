<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BER Survey">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>BER Site Survey</title>
<style>.offline-badge{font:600 12px/1 var(--f-body,system-ui);padding:5px 8px;border-radius:999px;white-space:nowrap}.offline-badge.ok{background:var(--accent-soft,#d6ede1);color:var(--accent,#0b7a45)}.offline-badge.wait{background:var(--warn-soft,#fdebd9);color:var(--warn,#b54708)}</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: sticky header + six DEAP section tabs; form groups in a two-up grid; walls column with a sticky DEAP totals panel beside it on iPad, stacked on phone */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --line:#c9d3ce;
  --ink:#16231d; --muted:#5a6b63; --accent:#0b7a45; --accent-ink:#ffffff; --accent-soft:#d6ede1;
  --warn:#b54708; --warn-soft:#fdebd9; --danger:#b42318;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#18221d; --sunk:#0c120f; --line:#2c3a33;
  --ink:#e4ece8; --muted:#94a69d; --accent:#3cc47f; --accent-ink:#06170e; --accent-soft:#173828;
  --warn:#f59e4b; --warn-soft:#3a2413; --danger:#f0776b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221d; --sunk:#0c120f; --line:#2c3a33;
  --ink:#e4ece8; --muted:#94a69d; --accent:#3cc47f; --accent-ink:#06170e; --accent-soft:#173828;
  --warn:#f59e4b; --warn-soft:#3a2413; --danger:#f0776b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--f-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.num,td.n,.v,.wnet,.fcalc{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.num,input[inputmode=decimal],input[inputmode=numeric]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.bands{display:flex;height:22px}
.bands i{width:6px}
.brand h1{font-size:22px}
.survey-pick{display:flex;gap:8px;align-items:center}
.survey-pick select{max-width:230px}
@media (max-width:520px){.survey-pick{width:100%}.survey-pick select{flex:1;max-width:none}}
.tabs{display:flex;gap:4px;max-width:1200px;margin:8px auto 0;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .soon{font-size:11px;color:var(--muted);margin-left:4px}

main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

input[type=text],input[type=date],input:not([type]),input[inputmode],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{min-height:36px;padding:0 10px;font-size:14px}

.intro{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px}
.intro b{font-weight:600}

.wall{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.wall-head{display:grid;grid-template-columns:76px minmax(0,1fr) 96px 96px;gap:10px;align-items:end}
.wall-head .span2{grid-column:span 2}
.wall-head .wtype{grid-column:1/4}
@media (max-width:520px){.wall-head{grid-template-columns:72px minmax(0,1fr) minmax(0,1fr)}.wall-head>.field:nth-child(2){grid-column:2/4}.wall-head .wtype{grid-column:1/3}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;min-height:36px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.dirsel{font-weight:700;font-size:17px;text-align:center;background:var(--accent-soft)!important;border-color:var(--accent)!important}
input.auto::placeholder{color:var(--muted);font-size:15px}
input.auto{border-style:dashed;background:var(--bg)}
.wnetbox{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;min-height:44px}
.wnet{font-family:var(--f-num);font-size:21px;color:var(--accent)}
.wall.floor{gap:12px}
.fline{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 16px minmax(0,1fr) 16px 84px 40px;gap:8px;align-items:end}
.fline.old{grid-template-columns:minmax(0,1fr) 72px minmax(0,1.2fr) minmax(0,.8fr) 16px minmax(0,.8fr) 16px 84px 40px}
.sym{align-self:end;padding-bottom:11px;color:var(--muted);text-align:center;font-size:18px;white-space:nowrap}
.gross{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;min-height:44px}
.gross .v{font-family:var(--f-num);font-size:18px}
.xsp{width:40px}
.btn.dashed{border-style:dashed}
.ftbl{display:flex;flex-direction:column;gap:6px}
#rirSec{scroll-margin-top:200px}
.oprow{display:grid;grid-template-columns:minmax(0,1fr) 58px 150px 62px 78px 74px 46px minmax(0,1.3fr) 54px 32px;gap:6px;align-items:center}
.oprow.inw{grid-template-columns:minmax(0,1fr) 54px 146px 58px 70px 64px 42px minmax(0,1.2fr) minmax(0,.8fr) 52px 30px}
.oprow select,.oprow input{min-height:40px;padding:6px 6px}
.oph{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.oprow .r{text-align:right}
.kind{font-size:14px}.kind.door{color:var(--muted)}
@media (max-width:640px){
  .fline,.fline.old{grid-template-columns:1fr 1fr;row-gap:6px}.fline .sym{display:none}.fline .xsp{display:none}
  .oprow,.oprow.inw{grid-template-columns:64px 1fr 1fr 40px;padding:8px;background:var(--bg);border-radius:8px}.oprow>input:first-child{grid-column:1/-1}.oph{display:none}
}
.wrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 84px;gap:12px;align-items:center;padding:10px 14px}
.wrow .dir{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--accent-soft);font-weight:700;font-size:17px}
.wrow-m{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrow .wnet{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;min-height:36px;padding:0 10px;border-radius:18px;background:var(--sunk);font-size:14px;border:0;color:inherit;cursor:pointer}
span.chip{min-height:28px;cursor:default;font-size:13px}
.code{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 6px;font-size:12px;font-weight:700}
.code.door{background:var(--muted);color:var(--surface)}
.code.big{font-size:18px;padding:2px 10px;border-radius:6px}
.oppanel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.oppanel h4{margin:0;font-family:var(--f-display);font-size:17px}
.opgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opgrid{grid-template-columns:1fr 1fr}}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.tchip[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft)}
.tchip.add{border-style:dashed;color:var(--muted);font-weight:400}
.otype{background:var(--surface)}
.rir{background:var(--surface)}
.rir-in{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}
input.calc{border:1px dashed var(--accent);background:var(--accent-soft)}
input.calc::placeholder{color:var(--accent);opacity:.9}
.label.calc{color:var(--accent)}
.rir-ins{display:grid;grid-template-columns:130px repeat(4,minmax(110px,1fr));gap:8px 10px;align-items:center;min-width:560px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.x{min-height:40px;width:40px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:8px}

.wall-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.warn{background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:8px;font-size:14px}

aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){aside.panel{position:static}}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.totals div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.totals .v{font-family:var(--f-num);font-size:20px;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-bottom:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.types{display:flex;flex-direction:column;gap:6px}
.types .row input{flex:1}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:10}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px}
textarea{min-height:140px;font-family:var(--f-num);font-size:13px}
@media (prefers-reduced-motion:no-preference){.wall{transition:border-color .2s}}
.tab .cnt{font-family:var(--f-num);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.xfer summary{cursor:pointer;min-height:28px}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0 14px;min-height:38px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.subnav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.group h3{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:start}
.grid .wide{grid-column:1/-1}
.seg.yn button{min-width:56px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;background:var(--surface)}
.multi input{width:20px;height:20px;accent-color:var(--accent)}
.lrow{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.lrow .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));align-items:end}
.lrow-h{display:flex;align-items:center;justify-content:space-between}
.fcalc{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-family:var(--f-num);font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rhead h2{font-size:26px;margin-bottom:6px}
.rsec{display:flex;flex-direction:column;gap:8px;padding-top:14px;min-width:0}
.rsec h3{font-size:21px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.rsec h4{font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--accent);margin:6px 0 0}
.rkv{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:4px 18px;margin:0}
.rkv dt{color:var(--muted)}.rkv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rcap{font-weight:600;margin-top:4px}
.rpart{display:flex;flex-direction:column;gap:4px;min-width:0}
.rtbl{font-size:14px;width:auto;min-width:min(100%,420px)}.rtbl td,.rtbl th{padding:5px 8px;white-space:nowrap}
.rtbl tbody tr:nth-child(even){background:var(--sunk)}
.rnone{margin:0;color:var(--muted);font-style:italic}
.checks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{font-weight:600;font-size:14px;padding:4px 10px;border-radius:14px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}.chip.bad{background:var(--warn-soft);color:var(--warn)}
.chk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chk-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.chk-list .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--danger)}
.chk-list li.check .dot{background:var(--warn)}
.leave-badge{font:700 14px/1 var(--f-body,system-ui);padding:9px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;border:2px solid transparent;min-height:40px}
.leave-badge.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}.leave-badge.ok{background:var(--accent-soft);color:var(--accent)}
.lv-grp{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.lv-grp .dot{width:10px;height:10px;border-radius:50%}
.lv-grp.site{color:var(--danger)}.lv-grp.site .dot{background:var(--danger)}
.lv-grp.desk{color:var(--muted)}.lv-grp.desk .dot,.chk-list li.desk .dot{background:var(--muted)}
.lv-grp.noted{color:var(--accent)}.lv-grp.noted .dot,.chk-list li.noted .dot{background:var(--accent)}
.leave .why{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.leave .chk-list li{flex-wrap:wrap}.leave .chk-list .ct{flex:1 1 220px}
.btn.cam{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.btn.muted-b{color:var(--muted)}
.lv-big{display:block;width:100%;margin-top:10px;padding:16px;border-radius:12px;font:800 18px/1.2 var(--f-body,system-ui);text-align:center;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.lv-big.go{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
.chk-list .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.chk-list .cs{font-size:13px;color:var(--muted)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.img{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.img img{width:100%;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.img figcaption{font-weight:600;font-size:14px}
.camhd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.camhd h3{margin:0}
.btn.camb{display:inline-flex;align-items:center;gap:6px;color:var(--accent);background:var(--accent-soft);border-color:transparent;flex:none}
.pstrip{display:flex;gap:10px;flex-wrap:wrap}
.pfig{margin:0;width:112px;display:flex;flex-direction:column;gap:2px}
.pfig .pth{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:112px;height:96px;background:#fff;cursor:pointer;display:block}
.pfig .pth img{width:100%;height:100%;object-fit:cover;display:block}
.pfig input{border:0;border-bottom:1px solid transparent;border-radius:0;background:none;padding:2px 0;min-height:0;font-size:13px;color:var(--muted);width:100%;text-overflow:ellipsis}
.pfig input:focus{border-bottom-color:var(--accent);color:var(--ink);outline:none}
.prow{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .sn{font-weight:600;font-size:15px}.prow .sn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
@media (max-width:560px){.prow{grid-template-columns:1fr}}
.pview{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.pview img{max-width:100%;max-height:calc(100% - 120px);border-radius:8px;background:#fff}
.pview .cap{color:#fff;font-weight:600;text-align:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.ent-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ent-top h2{font-size:22px;margin-right:auto}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--accent)}
.subnav .left{font-family:var(--f-num);font-size:12px;margin-left:6px;opacity:.75}
.subnav button.alldone{color:var(--accent)}
.ents{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ent{display:grid;grid-template-columns:52px minmax(0,220px) minmax(0,1fr);gap:4px 12px;align-items:center;padding:8px 12px 8px 4px;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent-cap{padding:12px 14px 6px;font-family:var(--f-display);font-weight:600;font-size:17px;border-bottom:1px solid var(--line);background:var(--sunk)}
.ent-k{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ent-v{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ent.done .ent-k,.ent.done .cp{opacity:.45}
.ent.done .cp b{text-decoration:line-through}
.ent.info{grid-template-columns:52px minmax(0,220px) minmax(0,1fr);background:var(--sunk)}
.tick{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:22px;line-height:1;color:var(--accent-ink);justify-self:center}

.cp:active{background:var(--accent-soft)}
@media (max-width:600px){.ent{grid-template-columns:52px minmax(0,1fr)}.ent-v{grid-column:2}}

<script>
(function(){
const KEY='ber-survey-v1';
const ORIENTS=['N','NE','E','SE','S','SW','W','NW'];
const DEFAULT_TYPES=['Cavity wall','Solid wall','Timber frame','Hollow block','Semi-exposed wall','Unknown'];
// ---- DEAP survey schema ----
const YN={type:'yn'};
const OVERSHADE=['None or very little','Modest','Significant','Heavy'];
// window overshading in DEAP's own words, set on each window
const WIN_SHADE=['Very Little','Average or Unknown','More Than Average','Heavy'];
const OLD_SHADE={'None or very little':'Very Little','Modest':'Average or Unknown','Significant':'More Than Average','Heavy':'Heavy'};
const opShade=o=>o.kind==='door'?'':o.shade||'';
const FUELS=['Heating oil','Mains gas','Bulk LPG','Bottled LPG','Electricity','Wood pellets (bags)','Wood pellets (bulk)','Wood logs','Wood chips','Coal','Anthracite','Smokeless fuel','Solid multi-fuel','Peat briquettes','Sod peat','None'];
const F=(id,label,o)=>Object.assign({id,label,type:'text'},o||{});
const N=(id,label,o)=>F(id,label,Object.assign({type:'num'},o));
const S_=(id,label,options,o)=>F(id,label,Object.assign({type:'select',options},o));
const B=(id,label,o)=>F(id,label,Object.assign({type:'yn'},o));
const NOTES=id=>({title:'Notes',fields:[F(id||'notes','Notes',{type:'textarea',wide:1})]});
const is=(k,...v)=>d=>v.includes(d[k]);

const EVID=['Measured on site','Photo taken','Receipt / cert','Homeowner info','Assumed / default'];
const WALL_FIELDS=[
  S_('cons','Construction',['Unknown','Cavity, unfilled','Cavity, filled','Solid masonry','Hollow block','Stone','Timber frame','Steel frame','Other']),
  N('thick','Thickness mm',{int:1}),
  S_('ins','Added insulation',['Unknown','None','Cavity fill (pumped bead / fibre)','Internal dry-lining','External insulation','Built-in insulation (new build)']),
  N('insmm','Insulation mm',{int:1,show:d=>d.ins&&d.ins!=='None'&&d.ins!=='Unknown'}),
  F('year','Year built'),N('u','U-value (if known)'),S_('ev','Evidence',EVID)];

const WIN_FIELDS=[
  S_('glazing','Glazing type',['Single','Double','Double low-E','Triple','Triple low-E','Secondary glazing']),
  S_('frame','Frame',['PVC','Wood','Metal','Metal with thermal break','Composite']),
  S_('gap','Gap',['6 mm','12 mm','16 mm or more'],{show:d=>d.glazing!=='Single'}),S_('fill','Gas fill',['Air','Argon','Unknown'],{show:d=>d.glazing!=='Single'}),
  N('win_u','U-value (if certified)'),S_('win_u_src','U-value evidence',['Cert / datasheet on file','Label seen on window','None, use DEAP default']),F('win_year','Year installed')];
const DOOR_FIELDS=[S_('doortype','Door type',['Solid wood','Half glazed','Fully glazed','PVC','Composite','Insulated steel']),N('door_u','U-value (if certified)'),S_('door_u_src','U-value evidence',['Cert / datasheet on file','None, use DEAP default'])];
// Tab and field order follow the DEAP software tabs as listed in SEAI's DEAP Survey Guide
const PART=S_('part','Part of house',['Original','Extension 1','Extension 2','Extension 3']);
const SECTIONS=[
  {id:'details',name:'Dwelling details',groups:[
    {title:'Property',fields:[
      N('mprn','MPRN',{int:1}),
      F('_name','Property address',{wide:1}),
      F('eircode','Eircode'),F('county','County'),
      S_('dtype','Dwelling type',['Ground-floor apartment','Mid-floor apartment','Top-floor apartment','End of terrace house','Mid-terrace house','Semi-detached house','Detached house','Maisonette','Basement apartment']),
      N('year','Dwelling age (year built)',{int:1}),
      B('ext','Is there an extension?'),F('extyear','Extension age (year built)',{show:is('ext','Yes'),hint:'List each, e.g. 1995, 2008'}),
      N('storeys','No. of storeys',{int:1}),N('rooms','No. of habitable rooms',{int:1})]},
    {title:'Rating',fields:[
      S_('purpose','Purpose of rating',['Sale','Letting','Grant support','New dwelling for owner occupation','Other']),
      S_('rtype','Type of rating',['Existing','Provisional','New final']),
      F('date','Date of survey',{type:'date'}),F('client','Client'),F('client_tel','Client phone'),
      F('planning','Planning ref (new dwellings)')]},
    {title:'Sketches & photos',custom:'images'},
    {title:'Comment box',fields:[F('notes','Comments',{type:'textarea',wide:1})]}]},
  {id:'building',name:'Building',subs:[
    {id:'dims',name:'Floors',groups:[
      {title:'Storey heights and floor areas',hint:'Internal dimensions per storey. Room height is floor to ceiling. Enter room in roof as its own storey.',fields:[
        F('storeys','Storeys',{type:'list',add:'+ Storey',cols:[S_('level','Level',['Ground floor','First floor','Second floor','Third floor','Room in roof','Basement']),N('area','Floor area m²'),N('height','Storey height m')]}),
        F('_c','',{type:'calc',calc:'dims'})]},
      {title:'Living area',fields:[N('living','Living area m²',{hint:'Largest public room plus any open-plan space'}),F('_c2','',{type:'calc',calc:'livingFrac'})]},
      {title:'Heat loss floors',fields:[
        F('floors','Heat loss floors',{type:'list',add:'+ Heat loss floor',cols:[
          PART,S_('type','Floor type',['Solid ground floor','Suspended timber','Suspended concrete','Exposed floor (over outside air)','Semi-exposed (over garage)']),
          N('area','Area m²'),N('perim','Exposed perimeter m'),N('ins','Insulation mm'),N('u','U-value (if known)'),S_('ev','Evidence',EVID)]})]},
      NOTES()]},
    {id:'roofs',name:'Roofs',groups:[
      {title:'Heat loss roofs',fields:[
        F('roofs','Roofs',{type:'list',add:'+ Roof',cols:[
          PART,S_('type','Roof type',['Pitched, insulated at joists','Pitched, insulated at rafters','Flat roof','Room in roof'],{onpick:rirPick}),
          S_('attic','Attic space',['Ventilated','Unventilated','No attic']),
          N('area','Area m²'),N('ins','Insulation mm'),S_('mat','Insulation type',['Mineral wool','PIR / PUR board','EPS','Sheep wool','Unknown']),N('u','U-value (if known)'),S_('ev','Evidence',EVID)]})]},
      {title:'Room in roof',custom:'rir'},
      NOTES()]},
    {id:'walls',name:'Walls',walls:true},
    {id:'openings',name:'Windows & doors',groups:[
      {title:'Window types',custom:'wintypes'},
      {title:'Door types',custom:'doortypes'},
      {title:'Windows/doors draught stripping',fields:[
        N('op_total','Total openings',{int:1,phFn:()=>'('+wallOpCount()+' on walls)',hint:'Leave blank to use the openings from your walls'}),
        N('op_strip','Openings draught stripped',{int:1}),
        F('_c','',{type:'calc',calc:'drstrip'})]},
      {title:'What DEAP gets',custom:'deaplines'},
      {title:'Roof lights',fields:[
        F('rooflights','Roof lights',{type:'list',add:'+ Roof light',cols:[N('w','Width m'),N('h','Height m'),N('qty','Qty',{int:1}),S_('orient','Faces',['Horizontal'].concat(ORIENTS)),N('pitch','Pitch °')]})]},
      NOTES()]},
    {id:'fabric',name:'Rooms & global factors',groups:[
      {title:'Thermal bridging',fields:[
        S_('tb','Thermal bridging factor',['Default 0.15','Acceptable Construction Details 0.08','Calculated value']),
        N('y','y-value W/m²K',{show:is('tb','Calculated value')})]},
      {title:'Thermal mass',fields:[S_('mass','Thermal mass category',['Low','Medium-low','Medium','Medium-high','High'])]},
      NOTES()]}
  ]},
  {id:'vent',name:'Ventilation',groups:[
    {title:'Infiltration due to openings',fields:[
      N('chimneys','Chimneys',{int:1}),N('flues','Open flues',{int:1}),N('fans','Intermittent fans',{int:1}),
      N('vents','Background / passive vents',{int:1}),N('flueless','Flueless combustion room heaters',{int:1}),
      B('lobby','Draught lobby')]},
    {title:'Structural air tightness',fields:[
      B('tested','Pressure test done'),
      N('q50','Result m³/(h·m²) at 50 Pa',{show:is('tested','Yes')}),F('testcert','Test cert ref',{show:is('tested','Yes')}),
      S_('structure','Structure type',['Masonry','Timber frame or steel frame'],{show:d=>d.tested!=='Yes'}),
      S_('susfloor','Ground floor',['Solid','Suspended, sealed','Suspended, unsealed'],{show:d=>d.tested!=='Yes'}),
      N('hatches','Attic hatches',{int:1,show:d=>d.tested!=='Yes'}),N('hatches_ds','Attic hatches draught stripped',{int:1,show:d=>d.tested!=='Yes'}),
      S_('sheltered','Sheltered sides',['0','1','2','3','4'])]},
    {title:'Ventilation method',fields:[
      S_('mech','Ventilation method',['Natural ventilation','Positive input from loft','Positive input from outside','Whole-house extract','Balanced, with heat recovery (MVHR)','Balanced, no heat recovery']),
      F('mv_model','Make & model',{show:d=>d.mech&&d.mech!=='Natural ventilation'}),
      N('sfp','Specific fan power W/(l/s)',{show:d=>d.mech&&d.mech!=='Natural ventilation'}),
      N('hre','Heat recovery efficiency %',{show:is('mech','Balanced, with heat recovery (MVHR)')}),
      S_('ducts','Ducting',['Rigid','Flexible','Rigid and flexible'],{show:d=>d.mech&&d.mech!=='Natural ventilation'}),
      S_('ductins','Ducts insulated',['Yes','No','Not applicable'],{show:is('mech','Balanced, with heat recovery (MVHR)')})]},
    NOTES()]},
  {id:'heat',name:'Space heating',groups:[
    {title:'Main space and water heating system',fields:[
      S_('src','Heat source',['Oil boiler','Gas boiler','LPG boiler','Solid fuel boiler','Biomass boiler','Heat pump, air to water','Heat pump, ground to water','Heat pump, exhaust air','Electric storage heaters','Direct electric heaters','Solid fuel stove with back boiler','Range cooker boiler','Group heating scheme','District heating scheme','CHP','None']),
      S_('fuel','Fuel',FUELS),F('make','Make & model',{hint:'For HARP database lookup'}),
      N('eff','Efficiency % / SPF'),S_('eff_src','Efficiency evidence',['HARP database','Manufacturer datasheet','Commissioning cert','DEAP default']),F('harp','HARP reference'),F('hyear','Year installed'),
      B('cond','Condensing',{show:d=>/boiler/i.test(d.src||'')}),
      S_('flue','Flue type',['Open','Balanced','Fan assisted'],{show:d=>/boiler/i.test(d.src||'')}),
      B('inside','Boiler in heated space',{show:d=>/boiler/i.test(d.src||'')}),
      N('flow','Design flow temp °C',{show:d=>/heat pump/i.test(d.src||'')}),
      N('dlf','Distribution loss factor',{show:is('src','Group heating scheme','District heating scheme')})]},
    {title:'Controls and responsiveness',fields:[
      S_('emit','Heat emitters',['Radiators','Underfloor heating','Radiators and underfloor','Fan coil units','Storage heaters','Room heaters','Warm air']),
      F('controls','Controls present',{type:'multi',wide:1,options:['Programmer','Time switch','Room thermostat','Programmable room thermostat','Cylinder thermostat','TRVs','Boiler interlock','Time and temperature zone control','Weather compensator','Load compensator','Delayed start thermostat','Flow switch','Bypass','Boiler energy manager']})]},
    {title:'Pumps and fans',fields:[
      B('pump','Central heating pump'),B('pump_in','Pump in heated space',{show:is('pump','Yes')}),
      B('oilpump_in','Oil boiler fuel pump inside',{show:is('fuel','Heating oil')}),
      B('fluefan','Gas boiler flue fan',{show:d=>/Mains gas|LPG/.test(d.fuel||'')}),
      B('warmair','Warm air heating or fan coil radiators')]},
    {title:'Secondary heating system',fields:[
      S_('sec','Secondary system',['None','Open fire in grate','Open fire with back boiler','Closed stove','Gas fire','Electric heater','Flueless gas heater','Other']),
      S_('secfuel','Fuel',FUELS,{show:d=>d.sec&&d.sec!=='None'}),N('seceff','Efficiency %',{show:d=>d.sec&&d.sec!=='None'})]},
    NOTES()]},
  {id:'water',name:'Water heating',groups:[
    {title:'Options',fields:[
      S_('src','Water heat source',['Same as main space heating','Secondary heating system','Electric immersion only','Instantaneous electric','Heat pump','Group heating scheme','Other']),
      B('combi','Combi boiler'),
      B('distloss','Distribution losses'),B('storeloss','Storage losses'),
      B('summer_imm','Supplementary electric water heating in summer'),
      S_('imm','Immersion',['None','Single','Dual'])]},
    {title:'Storage',fields:[
      B('cyl','Hot water cylinder'),
      N('vol','Water storage volume L',{show:is('cyl','Yes')}),
      S_('cylins','Insulation type',['Factory insulated','Loose jacket','None'],{show:is('cyl','Yes')}),
      N('cylmm','Insulation thickness mm',{show:is('cyl','Yes')}),
      B('indoors','Storage indoors',{show:is('cyl','Yes')}),
      B('cylstat','Cylinder thermostat',{show:is('cyl','Yes')}),
      S_('primins','Primary pipework insulated',['None','First 1 m from cylinder','All accessible pipework','Fully insulated'],{show:is('cyl','Yes')}),
      S_('primcirc','Primary circuit',['Pumped','Gravity'],{show:is('cyl','Yes')}),
      B('septime','Water separately timed',{show:is('cyl','Yes')})]},
    {title:'Showers and baths',fields:[
      F('showers','Showers',{type:'list',add:'+ Shower',cols:[S_('type','Shower type',['Vented mixer','Electric','Pumped / power','Mains pressure mixer']),N('flow','Flow l/min'),S_('restrict','Flow restrictor',['No','Yes']),S_('wwhr','WWHR',['No','Yes'])]}),
      N('baths','Baths',{int:1})]},
    {title:'Solar',fields:[
      B('solar','Solar thermal panels'),
      S_('coll','Collector type',['Flat plate','Evacuated tube'],{show:is('solar','Yes')}),
      N('aper','Aperture area m²',{show:is('solar','Yes')}),
      N('eta0','Zero loss collector efficiency',{show:is('solar','Yes')}),N('a1','Collector heat loss coefficient',{show:is('solar','Yes')}),
      S_('sorient','Orientation',ORIENTS,{show:is('solar','Yes')}),N('spitch','Tilt °',{show:is('solar','Yes')}),
      S_('sshade','Overshading',OVERSHADE,{show:is('solar','Yes')}),
      N('svol','Dedicated solar storage L',{show:is('solar','Yes')}),F('smodel','Make & model',{show:is('solar','Yes')})]},
    NOTES()]},
  {id:'gen',name:'Renewables',groups:[
    {title:'Solar PV',fields:[
      F('pv','PV arrays',{type:'list',add:'+ PV array',cols:[N('panels','Number of panels',{int:1}),N('wp','Peak power per panel W'),N('kwp','Array peak power kWp'),S_('orient','Orientation',ORIENTS),N('pitch','Tilt °'),S_('shade','Overshading',OVERSHADE),S_('ev','Evidence',['Cert / commissioning report','Panel label','Estimated'])]}),
      N('battery','Battery kWh'),F('pvmodel','Panels / inverter make')]},
    {title:'Wind',fields:[B('wind','Wind turbine'),N('windkw','Rated output kW',{show:is('wind','Yes')}),N('hub','Hub height m',{show:is('wind','Yes')})]},
    {title:'Micro-CHP',fields:[B('chp','Micro-CHP'),F('chpmodel','Make & model',{show:is('chp','Yes')}),N('chpeff','Electrical efficiency %',{show:is('chp','Yes')})]},
    NOTES()]},
  {id:'leave',name:'Before you leave',util:true},
  {id:'summary',name:'DEAP summary',util:true},
  {id:'entry',name:'Enter in DEAP',util:true},
  {id:'backup',name:'Backup',util:true}
];
const BSUBS=SECTIONS[1].subs;
const uid=()=>Math.random().toString(36).slice(2,9);
const n=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const f2=v=>(Math.round(v*100)/100).toFixed(2);

function blankWall(o){return Object.assign({id:uid(),name:'',orient:'S',type:DEFAULT_TYPES[0],shape:'rect',L:'',H:'',apex:'',area:'',ops:[]},o||{})}
function blankOp(kind,o){return Object.assign({id:uid(),kind:kind,name:'',a:'',qty:'1'},o||{})}
function newSurvey(name){return {id:uid(),name:name||'New survey',created:Date.now(),types:DEFAULT_TYPES.slice(),walls:[],data:{}}}
function exampleSurvey(){
  const s=newSurvey('Example: 2-storey semi');
  s.example=true;
  s.data={details:{dtype:'Semi-detached house',year:'1998',storeys:'2'},dims:{storeys:[{level:'Ground floor',area:'48.5',height:'2.40'},{level:'First floor',area:'48.5',height:'2.45'}],living:'16.2'},walltypes:{'Cavity wall':{cons:'Cavity, filled',thick:'300',ins:'Cavity fill (pumped bead / fibre)',insmm:'100',year:'1998',ev:'Photo taken'}},openings:{glazing:'Double',frame:'PVC',gap:'16 mm or more',doortype:'Composite'}};
  const A=(o)=>blankOp('window',o),D=(o)=>blankOp('door',o);
  s.walls=[
    blankWall({level:'Ground floor',name:'Ground floor',orient:'',L:'31.20',ops:[A({orient:'S',name:'Living',a:'2.16',shade:'Very Little'}),D({orient:'S',name:'Front door',a:'1.89'}),A({orient:'N',name:'Kitchen',a:'1.65',shade:'More Than Average',g:{glazing:'Single',frame:'Wood'}}),A({orient:'N',name:'Patio (glazed)',a:'3.78',shade:'Average or Unknown'})]}),
    blankWall({level:'Ground floor',name:'Ground floor',orient:'',type:'Semi-exposed wall',L:'3.00'}),
    blankWall({level:'First floor',name:'First floor',orient:'',L:'31.20',ops:[A({orient:'S',name:'Bedrooms',a:'1.44',qty:'2',shade:'Very Little'}),A({orient:'E',name:'Landing',a:'0.63',shade:'Average or Unknown'})]}),
    blankWall({shape:'tri',name:'Gable top',orient:'',L:'8.40',apex:'2.60'})
  ];
  return s;
}

let db;
function load(raw){
  if(raw===undefined){try{raw=localStorage.getItem(KEY)}catch(e){raw=null}}
  try{db=JSON.parse(raw||'null')}catch(e){db=null}
  if(!db||!db.surveys||!Object.keys(db.surveys).length){const s=exampleSurvey();db={surveys:{[s.id]:s},current:s.id,tab:'walls'}}
  if(!db.surveys[db.current])db.current=Object.keys(db.surveys)[0];
  Object.values(db.surveys).forEach(s=>{s.data=s.data||{};delete s.dwelling;const d=s.data;
    // v6: heat loss floors live on the Floors tab; draught stripping moved to Windows & doors; water source renamed
    if(d.floors&&d.floors.floors){d.dims=d.dims||{};if(!d.dims.floors)d.dims.floors=d.floors.floors;delete d.floors}
    if(d.vent&&(d.vent.op_total||d.vent.op_strip)){d.openings=d.openings||{};['op_total','op_strip'].forEach(k=>{if(d.vent[k]&&!d.openings[k])d.openings[k]=d.vent[k];delete d.vent[k]})}
    if(d.water&&d.water.src==='Main space heating system')d.water.src='Same as main space heating';
    if(d.water&&d.water.src==='Combi boiler'){d.water.src='Same as main space heating';d.water.combi='Yes'}
    if(d.details&&d.details.extyear&&!d.details.ext)d.details.ext='Yes';
    if(s.types&&!s.types.includes('Unknown'))s.types.push('Unknown');
    // new surveys used to start with an empty wall-by-wall line ("Front"), which showed as an older survey and hid the floor cards
    if(Array.isArray(s.walls))s.walls=s.walls.filter(w=>w.level||w.shape==='tri'||w.rir||['L','H','area','apex'].some(k=>hasVal(w[k]))||(w.ops||[]).length);
    migrateOps(s)});
  if(db.tab==='walls'){db.tab='building';db.sub='walls'}
  if(!SECTIONS.some(x=>x.id===db.tab))db.tab='details';
  db.sub=db.sub||'dims';
}
let saveT;
// the surveys are saved twice: in localStorage, and in IndexedDB (much more room) as a second copy.
// On opening, whichever copy is newer wins, so a full localStorage can't lose typed work.
let savedSinceBoot=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{savedSinceBoot=true;db.savedAt=Date.now();const j=JSON.stringify(db);let ok=false;
  try{localStorage.setItem(KEY,j);ok=true}catch(e){}
  const done=ok2=>{if(!ok&&!ok2)toast('Could not save on this device. Go to Backup and copy this survey now')};
  if(IDB.db)idbReq('kv','readwrite',st=>st.put(j,'db')).then(()=>done(true),()=>done(false));else done(false)},250)}
const cur=()=>db.surveys[db.current];

// ---- geometry ----
// a wall with no height of its own takes the storey heights added up (room in roof and basement left out)
const autoH=s=>(((s.data||{}).dims||{}).storeys||[]).filter(r=>!/roof|basement/i.test(r.level||'')).reduce((a,r)=>a+n(r.height),0);
const wallH=w=>hasVal(w.H)?n(w.H):w.level?levelH(cur(),w.level):autoH(cur());
function gross(w){
  if(w.shape==='area')return n(w.area);
  if(w.shape==='tri')return 0.5*n(w.L)*n(w.apex);
  const r=n(w.L)*wallH(w);
  return w.shape==='gable'?r+0.5*n(w.L)*n(w.apex):r;
}
// an area typed in directly wins over width × height
const opEach=o=>hasVal(o.a)?n(o.a):n(o.w)*n(o.h);// w × h only on data not yet migrated
const opArea=o=>opEach(o)*Math.max(0,Math.round(n(o.qty)||0));
const opSize=o=>hasVal(o.a)?f2(n(o.a))+' m² each':f2(n(o.w))+' × '+f2(n(o.h));
const opsArea=w=>w.ops.reduce((a,o)=>a+opArea(o),0);
const net=w=>gross(w)-opsArea(w);

// ---- ui helpers ----
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
function numInput(id,val,label,oninput){return el('input',{id,inputmode:'decimal',value:val,placeholder:'0.00','aria-label':label,autocomplete:'off',oninput})}
function armButton(label,onConfirm,cls){
  const b=el('button',{class:'btn small danger '+(cls||'')},label);

// ---- summary ----
function summarise(s){
  const byType={},byOrient={};
  let g=0,o=0,win=0,door=0;
  s.walls.forEach(w=>{
    const t=byType[w.type]||(byType[w.type]={gross:0,ops:0,net:0});
    t.gross+=gross(w);t.ops+=opsArea(w);t.net+=net(w);g+=gross(w);o+=opsArea(w);
    w.ops.forEach(op=>{const a=opArea(op);const d=opDir(op,w),r=byOrient[d]||(byOrient[d]={window:0,door:0,items:[]});r[op.kind]+=a;r.items.push({wall:w.name,op,a});if(op.kind==='window')win+=a;else door+=a});
  });

}

// ---- sketches & photos: resized JPEGs, each in its own storage slot so typing doesn't rewrite them ----
// Photos are kept in IndexedDB, which on an iPad has hundreds of MB. They used to be in localStorage
// (about 5 MB on Safari, shared with the surveys), which filled up after about ten photos.
// On opening, photos still in localStorage are copied across, checked, and only then removed from localStorage.
// The open survey's photos are held in memory so every screen can show them straight away.
const IMGK=id=>'ber-img-'+id;

function imgPut(id,d){
  if(!IDB.db){try{localStorage.setItem(IMGK(id),d);return Promise.resolve(true)}catch(e){return Promise.resolve(false)}}
  imgCache.set(id,d);imgMissing.delete(id);
  return idbReq('images','readwrite',st=>st.put(d,id)).then(()=>true,()=>{imgCache.delete(id);return false});
}
const imgDel=id=>{imgCache.delete(id);try{localStorage.removeItem(IMGK(id))}catch(e){}if(IDB.db)idbReq('images','readwrite',st=>st.delete(id)).catch(()=>{})};
// load the open survey's photos into memory; photos of other surveys are let go
async function imgEnsure(s){
  if(!IDB.db)return;
  const want=new Set((s.images||[]).map(m=>m.id));
  for(const k of [...imgCache.keys()])if(!want.has(k))imgCache.delete(k);
  const need=[...want].filter(id=>!imgCache.has(id)&&!imgMissing.has(id));
  if(!need.length)return;
  const got={};
  await idbReq('images','readonly',st=>{need.forEach(id=>{const q=st.get(id);q.onsuccess=()=>{got[id]=q.result}})});
  need.forEach(id=>{if(got[id])imgCache.set(id,got[id]);else if(imgGet(id)==null)imgMissing.add(id)});
}
function imgCheck(){
  const s=cur();if(!IDB.db||imgLoading)return;
  if((s.images||[]).some(m=>!imgCache.has(m.id)&&!imgMissing.has(m.id)))imgLoading=imgEnsure(s).catch(()=>{}).then(()=>{imgLoading=null;render()});

async function imgMoveFromLocal(){
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ber-img-'))keys.push(k)}
  let moved=0;
  for(const k of keys){try{const d=localStorage.getItem(k),id=k.slice(8);if(!d)continue;
    await idbReq('images','readwrite',st=>st.put(d,id));
    const back=await idbReq('images','readonly',st=>st.get(id));

  const tabs=$('#tabs'),at=tabs.querySelector('.tab[aria-selected=true]');
  tabs.scrollLeft=tl;
  if(at&&(at.offsetLeft<tabs.scrollLeft||at.offsetLeft+at.offsetWidth>tabs.scrollLeft+tabs.clientWidth))tabs.scrollLeft=at.offsetLeft-16;
  imgCheck();
  const view=db.tab==='leave'?renderLeave():db.tab==='summary'?renderSummary():db.tab==='entry'?renderEntry():db.tab==='backup'?renderBackup():renderSection(SECTIONS.find(x=>x.id===db.tab));
  $('#main').replaceChildren(view);
  if(scrollY!==y)scrollTo(0,y);
}
// open: show the surveys straight away from localStorage, then switch on IndexedDB,
// move any photos across, and use its copy of the surveys if it is newer
const IDB={db:null};
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no indexedDB'));const r=indexedDB.open('ber-survey',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('images'))d.createObjectStore('images');if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));setTimeout(()=>rej(new Error('timeout')),5000)})}
function idbReq(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode),st=t.objectStore(store);let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('IndexedDB'))})}
const stamp=raw=>{try{return (JSON.parse(raw)||{}).savedAt||0}catch(e){return 0}};
load();render();
(async()=>{
  try{IDB.db=await idbOpen()}catch(e){return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  const moved=await imgMoveFromLocal();
  let ls=null;try{ls=localStorage.getItem(KEY)}catch(e){}
  try{const kv=await idbReq('kv','readonly',st=>st.get('db'));if(kv&&!savedSinceBoot&&stamp(kv)>stamp(ls))load(kv)}catch(e){}
  try{await imgEnsure(cur())}catch(e){}
  save();render();
  if(moved)toast('Photos moved to roomier storage on this device');
})();
})();
</script>

<script>
// register straight away and show whether this device has the app saved for use with no signal
(function(){
  const b=document.getElementById('offlineBadge');
  const show=ok=>{b.hidden=false;b.className='offline-badge '+(ok?'ok':'wait');b.textContent=ok?'✓ Works offline':'Needs internet once to save for offline'};
  if(!('serviceWorker' in navigator)||!window.caches){return}
  const check=()=>caches.match('index.html').then(r=>show(!!r)).catch(()=>show(false));
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  show(false);
  navigator.serviceWorker.ready.then(()=>setTimeout(check,500));
  check();
})();
</script>
