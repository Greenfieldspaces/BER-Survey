<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BER Survey">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b7a45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>BER Site Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: sticky header + six DEAP section tabs; form groups in a two-up grid; walls column with a sticky DEAP totals panel beside it on iPad, stacked on phone */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --line:#c9d3ce;
  --ink:#16231d; --muted:#5a6b63; --accent:#0b7a45; --accent-ink:#ffffff; --accent-soft:#d6ede1;
  --warn:#b54708; --warn-soft:#fdebd9; --danger:#b42318;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#18221d; --sunk:#0c120f; --line:#2c3a33;
  --ink:#e4ece8; --muted:#94a69d; --accent:#3cc47f; --accent-ink:#06170e; --accent-soft:#173828;
  --warn:#f59e4b; --warn-soft:#3a2413; --danger:#f0776b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221d; --sunk:#0c120f; --line:#2c3a33;
  --ink:#e4ece8; --muted:#94a69d; --accent:#3cc47f; --accent-ink:#06170e; --accent-soft:#173828;
  --warn:#f59e4b; --warn-soft:#3a2413; --danger:#f0776b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num,input[inputmode=decimal],input[inputmode=numeric]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.label{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.bands{display:flex;height:22px}
.bands i{width:6px}
.brand h1{font-size:22px}
.survey-pick{display:flex;gap:8px;align-items:center}
.survey-pick select{max-width:230px}
@media (max-width:520px){.survey-pick{width:100%}.survey-pick select{flex:1;max-width:none}}
.tabs{display:flex;gap:4px;max-width:1200px;margin:8px auto 0;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .soon{font-size:11px;color:var(--muted);margin-left:4px}

main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

input[type=text],input[type=date],input:not([type]),input[inputmode],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{min-height:36px;padding:0 10px;font-size:14px}

.intro{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px}
.intro b{font-weight:600}

.wall{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.wall-head{display:grid;grid-template-columns:minmax(0,1.4fr) 92px minmax(0,1.2fr);gap:8px}
@media (max-width:520px){.wall-head{grid-template-columns:1fr 92px}.wall-head .wtype{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;min-height:36px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end}
.gross{display:flex;flex-direction:column;justify-content:center;min-height:44px}
.gross .v{font-family:var(--f-num);font-size:17px}

.ops{display:flex;flex-direction:column;gap:6px}
.op{display:grid;grid-template-columns:100px minmax(0,1fr) 72px 72px 84px 52px 70px 40px;gap:6px;align-items:center}
.op-h{font-size:11px;letter-spacing:.04em}
.op .area{font-family:var(--f-num);text-align:right;font-size:15px}
.op input.dimmed{opacity:.4}
@media (max-width:640px){
  .op{grid-template-columns:1fr 1fr 1fr 1fr;row-gap:6px;padding:8px;background:var(--sunk);border-radius:8px}
  .op .k{grid-column:1/3}.op .nm{grid-column:3/5}
  .op .area{grid-column:1/4;text-align:left}
  .op .x{justify-self:end}
  .op-h{background:none!important;padding:0 8px!important;row-gap:0!important}.op-h .k,.op-h .nm,.op-h .hide-sm{display:none}
}
.op-add{display:flex;gap:8px;flex-wrap:wrap}
.x{min-height:40px;width:40px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:8px}

.wall-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.net{margin-right:auto;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.net .v{font-family:var(--f-num);font-size:26px;color:var(--accent)}
.net .calc{font-size:14px;color:var(--muted);font-family:var(--f-num)}
.warn{background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:8px;font-size:14px}

aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){aside.panel{position:static}}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.totals div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.totals .v{font-family:var(--f-num);font-size:20px;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-bottom:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.types{display:flex;flex-direction:column;gap:6px}
.types .row input{flex:1}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:10}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px}
textarea{min-height:140px;font-family:var(--f-num);font-size:13px}
@media (prefers-reduced-motion:no-preference){.wall{transition:border-color .2s}}
.tab .cnt{font-family:var(--f-num);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0 14px;min-height:38px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.subnav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.group h3{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:start}
.grid .wide{grid-column:1/-1}
.seg.yn button{min-width:56px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;background:var(--surface)}
.multi input{width:20px;height:20px;accent-color:var(--accent)}
.lrow{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.lrow .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));align-items:end}
.lrow-h{display:flex;align-items:center;justify-content:space-between}
.fcalc{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-family:var(--f-num);font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rhead h2{font-size:26px;margin-bottom:6px}
.rsec{display:flex;flex-direction:column;gap:8px;padding-top:14px;min-width:0}
.rsec h3{font-size:21px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.rsec h4{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--accent);margin:6px 0 0;text-transform:uppercase;letter-spacing:.06em}
.rkv{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:4px 18px;margin:0}
.rkv dt{color:var(--muted)}.rkv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rcap{font-weight:600;margin-top:4px}
.rpart{display:flex;flex-direction:column;gap:4px;min-width:0}
.rtbl{font-size:14px;width:auto;min-width:min(100%,420px)}.rtbl td,.rtbl th{padding:5px 8px;white-space:nowrap}
.rtbl tbody tr:nth-child(even){background:var(--sunk)}
.rnone{margin:0;color:var(--muted);font-style:italic}
.checks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{font-weight:600;font-size:14px;padding:4px 10px;border-radius:14px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}.chip.bad{background:var(--warn-soft);color:var(--warn)}
.chk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chk-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.chk-list .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--danger)}
.chk-list li.check .dot{background:var(--warn)}
.chk-list .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.chk-list .cs{font-size:13px;color:var(--muted)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.img{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.img img{width:100%;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.img figcaption{font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
</style>
</head>
<body>


<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="bands" aria-hidden="true"><i style="background:#00a651"></i><i style="background:#50b848"></i><i style="background:#bed630"></i><i style="background:#fff200"></i><i style="background:#fdb913"></i><i style="background:#f37021"></i><i style="background:#ed1c24"></i></div>
      <h1>BER Site Survey</h1>
    </div>
    <div class="survey-pick">
      <select id="surveySel" aria-label="Current survey"></select>
      <button class="btn" id="newSurvey">New survey</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const KEY='ber-survey-v1';
const ORIENTS=['N','NE','E','SE','S','SW','W','NW'];
const DEFAULT_TYPES=['Cavity wall','Solid wall','Timber frame','Hollow block','Semi-exposed wall'];
// ---- DEAP survey schema ----
const YN={type:'yn'};
const OVERSHADE=['None or very little','Modest','Significant','Heavy'];
const FUELS=['Heating oil','Mains gas','Bulk LPG','Bottled LPG','Electricity','Wood pellets (bags)','Wood pellets (bulk)','Wood logs','Wood chips','Coal','Anthracite','Smokeless fuel','Solid multi-fuel','Peat briquettes','Sod peat','None'];
const F=(id,label,o)=>Object.assign({id,label,type:'text'},o||{});
const N=(id,label,o)=>F(id,label,Object.assign({type:'num'},o));
const S_=(id,label,options,o)=>F(id,label,Object.assign({type:'select',options},o));
const B=(id,label,o)=>F(id,label,Object.assign({type:'yn'},o));
const NOTES=id=>({title:'Notes',fields:[F(id||'notes','Notes',{type:'textarea',wide:1})]});
const is=(k,...v)=>d=>v.includes(d[k]);

const EVID=['Measured on site','Photo taken','Receipt / cert','Homeowner info','Assumed / default'];
const WALL_FIELDS=[
  S_('cons','Construction',['Cavity, unfilled','Cavity, filled','Solid masonry','Hollow block','Stone','Timber frame','Steel frame','Other']),
  N('thick','Thickness mm',{int:1}),
  S_('ins','Added insulation',['None','Cavity fill (pumped bead / fibre)','Internal dry-lining','External insulation','Built-in insulation (new build)']),
  N('insmm','Insulation mm',{int:1,show:d=>d.ins&&d.ins!=='None'}),
  F('year','Year built'),N('u','U-value (if known)'),S_('ev','Evidence',EVID)];

const WIN_FIELDS=[
  S_('glazing','Glazing type',['Single','Double','Double low-E','Triple','Triple low-E','Secondary glazing']),
  S_('frame','Frame',['PVC','Wood','Metal','Metal with thermal break','Composite']),
  S_('gap','Gap',['6 mm','12 mm','16 mm or more'],{show:d=>d.glazing!=='Single'}),S_('fill','Gas fill',['Air','Argon','Unknown'],{show:d=>d.glazing!=='Single'}),
  N('win_u','U-value (if certified)'),S_('win_u_src','U-value evidence',['Cert / datasheet on file','Label seen on window','None, use DEAP default']),F('win_year','Year installed')];
const DOOR_FIELDS=[S_('doortype','Door type',['Solid wood','Half glazed','Fully glazed','PVC','Composite','Insulated steel']),N('door_u','U-value (if certified)'),S_('door_u_src','U-value evidence',['Cert / datasheet on file','None, use DEAP default'])];
// Tab and field order follow the DEAP software tabs as listed in SEAI's DEAP Survey Guide
const PART=S_('part','Part of house',['Original','Extension 1','Extension 2','Extension 3']);
const SECTIONS=[
  {id:'details',name:'Dwelling details',groups:[
    {title:'Property',fields:[
      N('mprn','MPRN',{int:1}),
      F('_name','Property address',{wide:1}),
      F('eircode','Eircode'),F('county','County'),
      S_('dtype','Dwelling type',['Ground-floor apartment','Mid-floor apartment','Top-floor apartment','End of terrace house','Mid-terrace house','Semi-detached house','Detached house','Maisonette','Basement apartment']),
      N('year','Dwelling age (year built)',{int:1}),
      B('ext','Is there an extension?'),F('extyear','Extension age (year built)',{show:is('ext','Yes'),hint:'List each, e.g. 1995, 2008'}),
      N('storeys','No. of storeys',{int:1}),N('rooms','No. of habitable rooms',{int:1})]},
    {title:'Rating',fields:[
      S_('purpose','Purpose of rating',['Sale','Letting','Grant support','New dwelling for owner occupation','Other']),
      S_('rtype','Type of rating',['Existing','Provisional','New final']),
      F('date','Date of survey',{type:'date'}),F('client','Client'),F('client_tel','Client phone'),
      F('planning','Planning ref (new dwellings)')]},
    {title:'Sketches & photos',custom:'images'},
    {title:'Comment box',fields:[F('notes','Comments',{type:'textarea',wide:1})]}]},
  {id:'building',name:'Building',subs:[
    {id:'dims',name:'Floors',groups:[
      {title:'Storey heights and floor areas',hint:'Internal dimensions per storey. Room height is floor to ceiling. Enter room in roof as its own storey.',fields:[
        F('storeys','Storeys',{type:'list',add:'+ Storey',cols:[S_('level','Level',['Ground floor','First floor','Second floor','Third floor','Room in roof','Basement']),N('area','Floor area m²'),N('height','Storey height m')]}),
        F('_c','',{type:'calc',calc:'dims'})]},
      {title:'Living area',fields:[N('living','Living area m²',{hint:'Largest public room plus any open-plan space'}),F('_c2','',{type:'calc',calc:'livingFrac'})]},
      {title:'Heat loss floors',fields:[
        F('floors','Heat loss floors',{type:'list',add:'+ Heat loss floor',cols:[
          PART,S_('type','Floor type',['Solid ground floor','Suspended timber','Suspended concrete','Exposed floor (over outside air)','Semi-exposed (over garage)']),
          N('area','Area m²'),N('perim','Exposed perimeter m'),N('ins','Insulation mm'),N('u','U-value (if known)'),S_('ev','Evidence',EVID)]})]},
      NOTES()]},
    {id:'roofs',name:'Roofs',groups:[
      {title:'Heat loss roofs',fields:[
        F('roofs','Roofs',{type:'list',add:'+ Roof',cols:[
          PART,S_('type','Roof type',['Pitched, insulated at joists','Pitched, insulated at rafters','Flat roof','Room in roof, sloping','Room in roof, flat ceiling','Room in roof, stud wall']),
          S_('attic','Attic space',['Ventilated','Unventilated','No attic']),
          N('area','Area m²'),N('ins','Insulation mm'),S_('mat','Insulation type',['Mineral wool','PIR / PUR board','EPS','Sheep wool','Unknown']),N('u','U-value (if known)'),S_('ev','Evidence',EVID)]})]},
      NOTES()]},
    {id:'walls',name:'Walls',walls:true},
    {id:'openings',name:'Windows & doors',groups:[
      {title:'Default for all windows',hint:'Set what most windows are. Change individual windows below only where they differ.',fields:WIN_FIELDS.concat([S_('shading','Window overshading',OVERSHADE)])},
      {title:'Default for all doors',fields:DOOR_FIELDS},
      {title:'Windows/doors draught stripping',fields:[
        N('op_total','Total windows & doors',{int:1,phFn:()=>'('+wallOpCount()+' on walls)',hint:'Leave blank to use the count from your walls'}),
        N('op_strip','No. draught stripped',{int:1}),
        F('_c','',{type:'calc',calc:'drstrip'})]},
      {title:'Each window and door',custom:'oplist'},
      {title:'Roof lights',fields:[
        F('rooflights','Roof lights',{type:'list',add:'+ Roof light',cols:[N('w','Width m'),N('h','Height m'),N('qty','Qty',{int:1}),S_('orient','Faces',['Horizontal'].concat(ORIENTS)),N('pitch','Pitch °')]})]},
      NOTES()]},
    {id:'fabric',name:'Rooms & global factors',groups:[
      {title:'Thermal bridging',fields:[
        S_('tb','Thermal bridging factor',['Default 0.15','Acceptable Construction Details 0.08','Calculated value']),
        N('y','y-value W/m²K',{show:is('tb','Calculated value')})]},
      {title:'Thermal mass',fields:[S_('mass','Thermal mass category',['Low','Medium-low','Medium','Medium-high','High'])]},
      NOTES()]}
  ]},
  {id:'vent',name:'Ventilation',groups:[
    {title:'Infiltration due to openings',fields:[
      N('chimneys','Chimneys',{int:1}),N('flues','Open flues',{int:1}),N('fans','Intermittent fans',{int:1}),
      N('vents','Background / passive vents',{int:1}),N('flueless','Flueless combustion room heaters',{int:1}),
      B('lobby','Draught lobby')]},
    {title:'Structural air tightness',fields:[
      B('tested','Pressure test done'),
      N('q50','Result m³/(h·m²) at 50 Pa',{show:is('tested','Yes')}),F('testcert','Test cert ref',{show:is('tested','Yes')}),
      S_('structure','Structure type',['Masonry','Timber frame or steel frame'],{show:d=>d.tested!=='Yes'}),
      S_('susfloor','Ground floor',['Solid','Suspended, sealed','Suspended, unsealed'],{show:d=>d.tested!=='Yes'}),

  if(!db.surveys[db.current])db.current=Object.keys(db.surveys)[0];
  Object.values(db.surveys).forEach(s=>{s.data=s.data||{};delete s.dwelling;const d=s.data;
    // v6: heat loss floors live on the Floors tab; draught stripping moved to Windows & doors; water source renamed
    if(d.floors&&d.floors.floors){d.dims=d.dims||{};if(!d.dims.floors)d.dims.floors=d.floors.floors;delete d.floors}
    if(d.vent&&(d.vent.op_total||d.vent.op_strip)){d.openings=d.openings||{};['op_total','op_strip'].forEach(k=>{if(d.vent[k]&&!d.openings[k])d.openings[k]=d.vent[k];delete d.vent[k]})}

    if(d.water&&d.water.src==='Combi boiler'){d.water.src='Same as main space heating';d.water.combi='Yes'}

  if(db.tab==='walls'){db.tab='building';db.sub='walls'}

}

// ---- geometry ----
function gross(w){
  if(w.shape==='area')return n(w.area);
  const r=n(w.L)*n(w.H);
  return w.shape==='gable'?r+0.5*n(w.L)*n(w.apex):r;
}
// an area typed in directly wins over width × height
const opEach=o=>hasVal(o.a)?n(o.a):n(o.w)*n(o.h);
const opArea=o=>opEach(o)*Math.max(0,Math.round(n(o.qty)||0));
const opSize=o=>hasVal(o.a)?f2(n(o.a))+' m² each':f2(n(o.w))+' × '+f2(n(o.h));
const opsArea=w=>w.ops.reduce((a,o)=>a+opArea(o),0);
const net=w=>gross(w)-opsArea(w);

function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}

// ---- summary ----
function summarise(s){
  const byType={},byOrient={};
  let g=0,o=0,win=0,door=0;
  s.walls.forEach(w=>{

    const d=opFields(o).map(f=>[f.label,opEff(o,f.id)]).filter(x=>hasVal(x[1])).map(x=>x[0].replace(' (if certified)','')+' '+x[1]).join(', ');
    L.push('  '+(w.name||'Wall')+' ['+w.orient+'] '+(o.kind==='door'?'Door':'Window')+(o.name?' '+o.name:'')+': '+opSize(o)+(n(o.qty)>1?' x'+o.qty:'')+' = '+f2(opArea(o))+' m²'+(d?' | '+d:''));
  }));
}
function fmtVal(f,v){return Array.isArray(v)?v.join(', '):v}
function sectionText(groups,key,L){
  const d=cur().data[key]||{};
  groups.forEach(g=>(g.fields||[]).forEach(f=>{
    if(f.show&&!f.show(d))return;
    if(f.type==='calc'){if(f.calc==='openings')return;L.push('  '+CALCS[f.calc]().replace(/\n/g,'\n  '));return}
    if(f.id==='_name')return;
    const v=d[f.id];if(!hasVal(v))return;
    if(f.type==='list'){L.push('  '+f.label+':');v.forEach((r,i)=>L.push('    '+(i+1)+'. '+f.cols.filter(c=>hasVal(r[c.id])).map(c=>c.label+' '+r[c.id]).join(', ')))}
    else L.push('  '+f.label+': '+fmtVal(f,v));
  }));
}

// live refresh without losing focus
function refresh(){
  const s=cur();
  s.walls.forEach(w=>{
    const c=document.querySelector('[data-wall="'+w.id+'"]');if(!c)return;
    c.querySelector('[data-gross]').textContent=f2(gross(w))+' m²';
    c.querySelector('[data-net]').textContent=f2(net(w))+' m²';
    c.querySelector('[data-calc]').textContent=calcText(w);
    c.querySelector('[data-warn]').hidden=net(w)>=0;
    w.ops.forEach(o=>{const row=c.querySelector('[data-op="'+o.id+'"]');if(!row)return;row.querySelector('[data-oparea]').textContent=f2(opArea(o))+' m²';const ea=row.querySelector('[data-opeach]');ea.placeholder=n(o.w)*n(o.h)?f2(n(o.w)*n(o.h)):'m²';const dim=hasVal(o.a);row.querySelectorAll('#ow-'+o.id+',#oh-'+o.id).forEach(i=>i.classList.toggle('dimmed',dim))});
  });
  const p=$('#panel');if(p)p.replaceWith(summaryPanel(true));
  document.querySelectorAll('[data-fcalc]').forEach(e=>{const fn=CALCS[e.dataset.fcalc];if(fn)e.textContent=fn()});
}
function render(){
  // keep the page where it is: build the new view first, then swap it in one step
  const y=scrollY,tl=$('#tabs').scrollLeft;
  renderHeader();
  const tabs=$('#tabs'),at=tabs.querySelector('.tab[aria-selected=true]');
  tabs.scrollLeft=tl;
  if(at&&(at.offsetLeft<tabs.scrollLeft||at.offsetLeft+at.offsetWidth>tabs.scrollLeft+tabs.clientWidth))tabs.scrollLeft=at.offsetLeft-16;
  const view=db.tab==='summary'?renderSummary():db.tab==='backup'?renderBackup():renderSection(SECTIONS.find(x=>x.id===db.tab));
  $('#main').replaceChildren(view);
  if(scrollY!==y)scrollTo(0,y);
}
load();save();render();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
